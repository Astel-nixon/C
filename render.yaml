services:
  - type: web
    name: wealth-planning-platform
    runtime: python
    rootDir: wealthai-starter
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEALTHAI_DB_PATH
        value: /tmp/wealthai.db
      - key: USE_REAL_DATA
        value: "0"
